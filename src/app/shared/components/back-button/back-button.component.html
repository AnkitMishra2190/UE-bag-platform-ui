<button
  type="button"
  (click)="goBack()"
  class="
    inline-flex
    items-center
    gap-2
    rounded-xl
    border
    border-gray-200
    bg-white
    px-4
    py-2.5
    text-sm
    font-medium
    text-gray-700
    shadow-sm
    transition-all
    duration-200
    hover:-translate-x-0.5
    hover:border-brand-200
    hover:bg-brand-50
    hover:text-brand-600
    dark:border-gray-700
    dark:bg-gray-900
    dark:text-gray-300
    dark:hover:border-brand-800
    dark:hover:bg-brand-950/40
    dark:hover:text-brand-400
  "
>
  <mat-icon
    class="
      !m-0
      !h-5
      !w-5
      !text-[20px]
    "
    aria-hidden="true"
  >
    arrow_back
  </mat-icon>

  <span>
    {{ label }}
  </span>
</button>
