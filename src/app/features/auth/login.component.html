<div class="login-screen">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark">UE</span>
      <div>
        <h1>Unick Enterprises</h1>
        <p class="text-muted">Operations Console</p>
      </div>
    </div>

    <hr class="stitch-divider" />

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field-label">Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="you@unickenterprises.com"
        />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <span class="field-error">Enter a valid email address.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <span class="field-error">Password is required.</span>
        }
      </label>

      @if (errorMessage()) {
        <div class="alert">{{ errorMessage() }}</div>
      }

      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
