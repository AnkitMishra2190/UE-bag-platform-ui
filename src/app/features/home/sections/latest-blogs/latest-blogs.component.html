<section class="bg-gray-50 dark:bg-gray-900/50 py-20 lg:py-28">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between flex-wrap gap-4 mb-12">
        <div>
        <span class="text-sm font-semibold tracking-wide uppercase text-brand-600 dark:text-brand-400">
            From the Blog
        </span>
        <h2 class="mt-3 text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">Latest Articles</h2>
        </div>
        <a routerLink="/blog" class="text-brand-600 dark:text-brand-400 font-medium hover:underline">
        View all articles
        </a>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
        @for (post of posts; track post.slug) {
        <a
            [routerLink]="['/blog']"
            class="group rounded-2xl bg-white dark:bg-gray-800 ring-1 ring-gray-900/5 dark:ring-white/10 shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden hover:-translate-y-1"
        >
            <div
            class="aspect-[16/9] bg-gradient-to-br from-brand-100 to-wine-100 dark:from-gray-700 dark:to-gray-800 flex items-center justify-center"
            >
            <mat-icon class="!w-10 !h-10 !text-4xl text-brand-300 dark:text-brand-600">article</mat-icon>
            </div>
            <div class="p-5">
            <p class="text-xs text-gray-400 dark:text-gray-500">{{ post.date }}</p>
            <h3
                class="mt-2 font-semibold text-gray-900 dark:text-white group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"
            >
                {{ post.title }}
            </h3>
            <p class="mt-2 text-sm text-gray-500 dark:text-gray-400 line-clamp-2">{{ post.excerpt }}</p>
            </div>
        </a>
        }
    </div>
    </div>
</section>
