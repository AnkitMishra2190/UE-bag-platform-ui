<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-28">
    <div class="text-center max-w-2xl mx-auto mb-14">
    <span class="text-sm font-semibold tracking-wide uppercase text-brand-600 dark:text-brand-400">
        Testimonials
    </span>
    <h2 class="mt-3 text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">What Our Clients Say</h2>
    </div>

    <div class="grid md:grid-cols-3 gap-6">
    @for (t of testimonials; track t.author) {
        <figure
        class="rounded-2xl p-6 bg-white dark:bg-gray-800 ring-1 ring-gray-900/5 dark:ring-white/10 shadow-sm flex flex-col"
        >
        <mat-icon class="text-brand-200 dark:text-brand-800 !w-8 !h-8 !text-3xl">format_quote</mat-icon>
        <blockquote class="mt-3 text-gray-600 dark:text-gray-300 text-sm leading-relaxed flex-1">
            {{ t.quote }}
        </blockquote>
        <figcaption class="mt-5 flex items-center gap-3">
            <div
            class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-500 to-wine-600 flex items-center justify-center text-white text-sm font-semibold"
            >
            {{ t.author.charAt(0) }}
            </div>
            <div>
            <p class="text-sm font-semibold text-gray-900 dark:text-white">{{ t.author }}</p>
            <p class="text-xs text-gray-400 dark:text-gray-500">{{ t.role }}</p>
            </div>
        </figcaption>
        </figure>
    }
    </div>
</section>
