<section class="bg-gray-50 dark:bg-gray-900/50 py-20 lg:py-28">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-end justify-between flex-wrap gap-4 mb-12">
        <div>
        <span class="text-sm font-semibold tracking-wide uppercase text-brand-600 dark:text-brand-400">
            Our Range
        </span>
        <h2 class="mt-3 text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">Featured Products</h2>
        </div>
        <a routerLink="/products" class="text-brand-600 dark:text-brand-400 font-medium hover:underline">
        View all products
        </a>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
        @for (product of products; track product.id) {
        <a
            [routerLink]="['/products']"
            class="group rounded-2xl bg-white dark:bg-gray-800 shadow-sm hover:shadow-xl ring-1 ring-gray-900/5 dark:ring-white/10 transition-all duration-300 overflow-hidden hover:-translate-y-1"
        >
            <div
            class="aspect-square flex items-center justify-center bg-gradient-to-br from-brand-50 to-wine-50 dark:from-gray-700 dark:to-gray-800"
            >
            <mat-icon class="!w-16 !h-16 !text-6xl text-brand-300 dark:text-brand-500">{{
                product.icon
            }}</mat-icon>
            </div>
            <div class="p-4">
            <p class="text-xs text-gray-400 dark:text-gray-500 uppercase tracking-wide">{{ product.category }}</p>
            <p
                class="mt-1 font-semibold text-gray-900 dark:text-white group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors"
            >
                {{ product.name }}
            </p>
            </div>
        </a>
        }
    </div>
    </div>
</section>
