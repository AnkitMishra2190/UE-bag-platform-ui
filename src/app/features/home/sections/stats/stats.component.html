<section #sectionRef class="bg-gray-900 dark:bg-gray-950 py-16 lg:py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-8 text-center">
        @for (stat of stats; track stat.label) {
        <div>
            <p class="text-4xl sm:text-5xl font-bold text-white">
            {{ displayValues()[stat.label] ?? 0 }}{{ stat.suffix }}
            </p>
            <p class="mt-2 text-sm text-gray-400">{{ stat.label }}</p>
        </div>
        }
    </div>
    </div>
</section>
