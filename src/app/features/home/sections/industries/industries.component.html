<section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-28">
    <div class="text-center max-w-2xl mx-auto mb-14">
    <span class="text-sm font-semibold tracking-wide uppercase text-brand-600 dark:text-brand-400">
        Who We Serve
    </span>
    <h2 class="mt-3 text-3xl sm:text-4xl font-bold text-gray-900 dark:text-white">Industries We Serve</h2>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
    @for (industry of industries; track industry.name) {
        <div
        class="rounded-2xl p-6 bg-white dark:bg-gray-800 ring-1 ring-gray-900/5 dark:ring-white/10 hover:ring-brand-300 dark:hover:ring-brand-700 transition-all duration-300"
        >
        <div
            class="w-12 h-12 rounded-xl bg-brand-50 dark:bg-brand-950 flex items-center justify-center text-brand-600 dark:text-brand-400"
        >
            <mat-icon>{{ industry.icon }}</mat-icon>
        </div>
        <h3 class="mt-4 font-semibold text-gray-900 dark:text-white">{{ industry.name }}</h3>
        <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">{{ industry.description }}</p>
        </div>
    }
    </div>
</section>
