<section class="bg-gray-50 dark:bg-gray-900/50 py-16 lg:py-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <p class="text-center text-sm font-semibold tracking-wide uppercase text-gray-400 dark:text-gray-500 mb-10">
        Trusted By Retailers &amp; Distributors
    </p>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-6">
        @for (client of clients; track client.name) {
        <div
            class="h-16 rounded-xl bg-white dark:bg-gray-800 ring-1 ring-gray-900/5 dark:ring-white/10 flex items-center justify-center grayscale opacity-60 hover:grayscale-0 hover:opacity-100 transition-all duration-300"
        >
            <span class="text-sm font-semibold text-gray-500 dark:text-gray-400">{{ client.name }}</span>
        </div>
        }
    </div>
    </div>
</section>
